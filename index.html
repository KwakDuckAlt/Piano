<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>PIANOVA — 올인원 피아노 학습·연주·작곡 플랫폼</title>
<style>
:root{--bg:#0e1016;--panel:#171a23;--panel2:#1f2330;--line:#2b3040;--text:#e9ecf3;--mute:#8d95a8;--accent:#e8b14a;--accent2:#5aa2ff;--good:#3ecf8e;--bad:#ff5d5d;--warn:#ffb020;--rh:#5aa2ff;--lh:#3ecf8e;--r:12px;--fs:16px;--btn:40px;--anim:1}
:root[data-theme=light]{--bg:#f3f1ec;--panel:#fff;--panel2:#f1eee8;--line:#d9d4c8;--text:#1d2029;--mute:#6a6f7d;--accent:#b7791f;--accent2:#2a6bd8;--good:#1d9e63;--bad:#d63c3c}
:root[data-theme=hc]{--bg:#000;--panel:#000;--panel2:#111;--line:#fff;--text:#fff;--mute:#ddd;--accent:#ffea00;--accent2:#00e5ff;--good:#00ff6a;--bad:#ff4d4d}
:root[data-cb=deut]{--good:#2a9df4;--bad:#e6a100}:root[data-cb=trit]{--good:#2ec4b6;--bad:#e63946}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--text);font:var(--fs)/1.5 system-ui,-apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}a{color:var(--accent2)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:var(--btn);padding:0 14px;cursor:pointer;transition:transform calc(.12s*var(--anim)),background .15s}
button:hover{background:var(--line)}button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--accent);color:#161616;border-color:transparent;font-weight:700}button.pri:hover{filter:brightness(1.08)}
button.good{background:var(--good);color:#06180f;border-color:transparent;font-weight:700}button.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
button.sm{min-height:30px;padding:0 10px;font-size:.85em;border-radius:8px}button.ghost{background:transparent}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=search],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
#top{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .logo{font-weight:800;letter-spacing:.14em;color:var(--accent);font-size:1.15em;cursor:pointer;white-space:nowrap}
#top .sp{flex:1}.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:.85em;white-space:nowrap}
.chip.on{border-color:var(--good);color:var(--good)}.chip.off{color:var(--mute)}
#nav{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 8px}
#nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:var(--text);text-decoration:none;cursor:pointer;margin-bottom:2px}
#nav a:hover{background:var(--panel2)}#nav a.act{background:var(--accent);color:#161616;font-weight:700}details.more>summary{cursor:pointer;color:var(--mute);padding:8px 0}
#main{overflow:auto;padding:18px;scroll-behavior:smooth}
.wrap{max-width:1500px;margin:0 auto}
h1{font-size:1.5em;margin:0 0 4px}h2{font-size:1.15em;margin:0 0 10px}h3{font-size:1em;margin:0 0 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.ga{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mute{color:var(--mute);font-size:.9em}.sp1{height:10px}.sp2{height:18px}
.bar{height:9px;background:var(--panel2);border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ffd88a);border-radius:9px;transition:width .4s}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78em;border:1px solid var(--line);color:var(--mute)}
.badge.EASY{color:var(--good);border-color:var(--good)}.badge.NORMAL{color:var(--accent2);border-color:var(--accent2)}.badge.HARD{color:var(--warn);border-color:var(--warn)}.badge.EXPERT,.badge.MASTER{color:var(--bad);border-color:var(--bad)}
.stage{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.stage:hover{border-color:var(--accent)}.stage.lock{opacity:.5}.stage.done{border-color:var(--good)}.stage .n{font-size:.75em;color:var(--mute);min-width:70px}
.sheet{background:#fbf8f1;--ink:#1b1b1f;--paper:#fbf8f1;--accent:#e8a838;--accent2:#2a6bd8;--good:#1fa463;--bad:#d9363e;border-radius:10px;overflow:auto;position:relative;color:#1b1b1f}
.sheet svg{display:block}.score-svg .warnn .hd{fill:#f59e0b!important}
#kbwrap{overflow-x:auto;padding-bottom:4px}
.kb{position:relative;height:130px;min-width:100%;user-select:none;touch-action:none;background:#000;border-radius:0 0 8px 8px;padding:0 0 2px}
.kb .w{position:absolute;top:0;bottom:2px;background:linear-gradient(#fdfdfd,#e8e6e0);border:1px solid #555;border-radius:0 0 5px 5px;color:#444;font-size:10px;text-align:center;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.kb .b{position:absolute;top:0;height:62%;background:linear-gradient(#333,#000);border:1px solid #000;border-radius:0 0 4px 4px;z-index:2}
.kb .w.on{background:linear-gradient(#ffe48a,#f2c24e)}.kb .b.on{background:linear-gradient(#c79a2b,#8a6a12)}
.kb .w.tgt{box-shadow:inset 0 0 0 3px var(--accent2);background:linear-gradient(#cfe4ff,#a8cdfb)}.kb .b.tgt{background:linear-gradient(#2f6fd0,#1b468c)}
.kb .w.ok,.kb .w.demo{background:linear-gradient(#a8f0cb,#3ecf8e)}.kb .b.ok,.kb .b.demo{background:linear-gradient(#2a9d6d,#14684a)}
.kb .w.bad{background:linear-gradient(#ffb0b0,#ff5d5d)}.kb .b.bad{background:linear-gradient(#c93c3c,#7a1717)}
.kb .w.mic{box-shadow:inset 0 -8px 0 var(--accent)}
.meter{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad))}
table{border-collapse:collapse;width:100%;font-size:.9em}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600}
.judge{font-weight:800;font-size:1.6em;min-height:1.6em;text-align:center;letter-spacing:.04em}
.judge.PERFECT,.judge.GREAT{color:var(--good)}.judge.WRONG,.judge.OCTAVE,.judge.LATE,.judge.EARLY{color:var(--bad)}
.beat{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--line);margin-right:5px}.beat.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:90;pointer-events:none;align-items:center}
#toast div{background:var(--panel2);border:1px solid var(--accent);padding:8px 16px;border-radius:99px;box-shadow:0 6px 24px #0008;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
#cap{position:fixed;left:0;right:0;bottom:0;background:#000d;color:#fff;text-align:center;padding:8px;z-index:80;display:none;font-size:1.1em}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:70;padding:14px}
.modal>.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px;animation:tin .2s}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button.act{background:var(--accent);color:#161616;border-color:transparent;font-weight:700}
.play{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.ans button{min-height:48px}
.big{font-size:2.2em;font-weight:800}.hl{color:var(--accent)}.ok{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.chart{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chart div{border:2px solid var(--line);border-radius:10px;padding:14px 6px;text-align:center;font-size:1.3em;font-weight:700}.chart div.cur{border-color:var(--accent);background:#e8b14a22}
.tool{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tool button.act{background:var(--accent);color:#161616}
label.f{display:grid;gap:4px;margin-bottom:10px}label.f>span{font-size:.85em;color:var(--mute)}
details>summary{cursor:pointer;padding:6px 0}pre{white-space:pre-wrap;background:var(--panel2);padding:10px;border-radius:8px;font-size:.85em;overflow:auto}
@media(max-width:1100px){.play{grid-template-columns:minmax(0,1fr)}.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:56px 1fr 58px}#nav{grid-row:3;grid-column:1;display:flex;overflow-x:auto;padding:4px;border-right:0;border-top:1px solid var(--line)}#nav a{flex-direction:column;gap:0;font-size:.68em;padding:4px 10px;white-space:nowrap}#nav a span.t{display:block}#main{padding:10px}.g2,.g3,.g4{grid-template-columns:1fr}.kb{height:110px}#top .hide-m{display:none}}
@media(max-height:480px) and (orientation:landscape){.kb{height:80px}#top{height:44px}#app{grid-template-rows:44px 1fr}}
:root[data-layout=mobile] .play{grid-template-columns:1fr}
@media(max-width:820px){#app{grid-template-columns:minmax(0,1fr)!important}#main,.wrap,.play>*,.grid>*,.card{min-width:0}#top{gap:6px;padding:0 8px;overflow:hidden}#top .chip{padding:4px 8px;font-size:12px;white-space:nowrap}#top #logo{font-size:15px;letter-spacing:1px}#micb,#midib{font-size:11px;padding:4px 6px}.wrap{padding:12px}.ctl,#ctl{flex-wrap:wrap}}
#main,.play>*,.grid>*,.card{min-width:0}
@media print{body{overflow:visible}#nav,#top{display:none}}
:root[data-anim="0"] *{animation:none!important;transition:none!important}
</style>

<body>
<div id="app">
  <div id="top"></div>
  <nav id="nav" aria-label="메인 메뉴"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toast" aria-live="polite"></div><div id="cap" aria-live="polite"></div>
<noscript>PIANOVA를 사용하려면 JavaScript가 필요합니다.</noscript>
<script>
/* ═══ dsp.js ═══ */
/* PIANOVA DSP — FFT, 다중 피치 추정(고조파 합산 + 반복 제거), YIN, 온셋 검출, 노트 트래커 */
const DSP = (() => {
  function makeFFT(n) {
    const levels = Math.round(Math.log2(n));
    const cos = new Float32Array(n / 2), sin = new Float32Array(n / 2);
    for (let i = 0; i < n / 2; i++) { cos[i] = Math.cos(2 * Math.PI * i / n); sin[i] = Math.sin(2 * Math.PI * i / n); }
    const rev = new Uint32Array(n);
    for (let i = 0; i < n; i++) { let r = 0; for (let b = 0; b < levels; b++) r |= ((i >> b) & 1) << (levels - 1 - b); rev[i] = r; }
    return function (re, im) {
      for (let i = 0; i < n; i++) { const j = rev[i]; if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
      for (let size = 2; size <= n; size <<= 1) {
        const half = size >> 1, step = n / size;
        for (let i = 0; i < n; i += size) {
          for (let j = i, k = 0; j < i + half; j++, k += step) {
            const l = j + half;
            const tre = re[l] * cos[k] + im[l] * sin[k];
            const tim = im[l] * cos[k] - re[l] * sin[k];
            re[l] = re[j] - tre; im[l] = im[j] - tim; re[j] += tre; im[j] += tim;
          }
        }
      }
    };
  }

  const m2f = m => 440 * Math.pow(2, (m - 69) / 12);
  const f2m = f => 69 + 12 * Math.log2(f / 440);

  /* YIN 단일 피치 (교차 검증·센트 정밀도용) */
  function yin(buf, sr, fmin = 55, fmax = 2100, thr = 0.12) {
    const W = Math.floor(buf.length / 2);
    const tauMax = Math.min(W - 1, Math.floor(sr / fmin)), tauMin = Math.max(2, Math.floor(sr / fmax));
    const d = new Float32Array(tauMax + 1);
    for (let tau = 1; tau <= tauMax; tau++) {
      let s = 0;
      for (let i = 0; i < W; i++) { const x = buf[i] - buf[i + tau]; s += x * x; }
      d[tau] = s;
    }
    let run = 0;
    const cm = new Float32Array(tauMax + 1); cm[0] = 1;
    for (let tau = 1; tau <= tauMax; tau++) { run += d[tau]; cm[tau] = run ? d[tau] * tau / run : 1; }
    let tau = -1;
    for (let t = tauMin; t <= tauMax; t++) {
      if (cm[t] < thr) { while (t + 1 <= tauMax && cm[t + 1] < cm[t]) t++; tau = t; break; }
    }
    if (tau < 0) return { f0: 0, prob: 0 };
    const a = cm[tau - 1] || cm[tau], b = cm[tau], c = cm[tau + 1] || cm[tau];
    const den = a - 2 * b + c, off = den ? 0.5 * (a - c) / den : 0;
    return { f0: sr / (tau + off), prob: 1 - cm[tau] };
  }

  /* 다중 피치 분석기 */
  class Analyzer {
    constructor(sr, N = 8192, opt = {}) {
      this.sr = sr; this.N = N; this.fft = makeFFT(N);
      this.win = new Float32Array(N);
      for (let i = 0; i < N; i++) this.win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));
      this.re = new Float32Array(N); this.im = new Float32Array(N); this.mag = new Float32Array(N / 2);
      this.opt = Object.assign({ lo: 33, hi: 100, maxPoly: 6, B: 0.0003, relThr: 0.012, minSal: 0.42, maxH: 8, dbRange: 46, subK: 1.1 }, opt);
    }
    spectrum(frame) {
      const { N, re, im, win, mag } = this;
      let rms = 0;
      for (let i = 0; i < N; i++) { const v = frame[i]; rms += v * v; re[i] = v * win[i]; im[i] = 0; }
      this.fft(re, im);
      for (let k = 0; k < N / 2; k++) mag[k] = Math.hypot(re[k], im[k]);
      return Math.sqrt(rms / N);
    }
    peaks() {
      const { mag, sr, N } = this, o = this.opt;
      let mx = 0; for (let k = 2; k < N / 2 - 2; k++) if (mag[k] > mx) mx = mag[k];
      const thr = mx * o.relThr, out = [];
      const kmax = Math.min(N / 2 - 2, Math.floor(5200 * N / sr));
      for (let k = 3; k < kmax; k++) {
        const b = mag[k];
        if (b > thr && b > mag[k - 1] && b >= mag[k + 1] && b > mag[k - 2] && b >= mag[k + 2]) {
          const la = Math.log(mag[k - 1] + 1e-12), lb = Math.log(b + 1e-12), lc = Math.log(mag[k + 1] + 1e-12);
          const den = la - 2 * lb + lc, d = den ? 0.5 * (la - lc) / den : 0;
          out.push({ f: (k + d) * sr / N, a: Math.exp(lb - 0.25 * (la - lc) * d), a0: 0 });
        }
      }
      out.forEach(p => p.a0 = p.a);
      return { list: out, max: mx };
    }
    harmonics(m, pk, amax) {
      const f0 = m2f(m), o = this.opt, res = [];
      const binHz = this.sr / this.N;
      for (let h = 1; h <= o.maxH; h++) {
        const tf = h * f0 * Math.sqrt(1 + o.B * h * h);
        if (tf > 5200) { res.push(null); continue; }
        const tol = Math.max(tf * (Math.pow(2, 35 / 1200) - 1), binHz * 0.9);
        let best = null;
        for (const p of pk) { if (p.f < tf - tol) continue; if (p.f > tf + tol) break; if (!best || p.a > best.a) best = p; }
        res.push(best);
      }
      return res;
    }
    /** frame(Float32Array N) → {rms, notes:[{midi,f0,amp,conf}]} */
    analyze(frame, gateRms = 0.002) {
      const rms = this.spectrum(frame);
      if (rms < gateRms) return { rms, notes: [], peaks: 0 };
      const o = this.opt, { list: pk, max: amax } = this.peaks();
      const W = [1, 1, .9, .8, .7, .6, .5, .4, .35, .3];
      const notes = [];
      let first = 0;
      for (let it = 0; it < o.maxPoly; it++) {
        let best = null;
        for (let m = o.lo; m <= o.hi; m++) {
          const hs = this.harmonics(m, pk, amax);
          let s = 0, ws = 0, cnt = 0, h1 = 0;
          for (let h = 0; h < o.maxH; h++) {
            ws += W[h];
            const p = hs[h]; if (!p) continue;
            const v = Math.max(0, Math.min(1, (20 * Math.log10(p.a / amax) + o.dbRange) / o.dbRange));
            if (v > 0.12) cnt++;
            s += W[h] * v; if (h === 0) h1 = v;
          }
          const sal = s / ws;
          // 기음 또는 2배음이 약하고 상위 배음만 있는 후보(하위 옥타브 오인식) 억제
          if (cnt < 3 || (m >= 45 && h1 < 0.2) || (m < 45 && !hs[1])) continue;
          if (!best || sal > best.sal) best = { m, sal, hs, cnt };
        }
        if (!best) break;
        const minSal = it === 0 ? o.minSal * 0.8 : o.minSal;
        if (best.sal < minSal) break;
        // 다음 음의 강도가 첫 음보다 너무 약하면 잡음/잔배음으로 간주
        const ref = Math.max(...best.hs.slice(0, 3).map(p => p ? p.a0 : 0));
        if (it === 0) first = ref;
        else if (ref < first * 0.06) break;
        notes.push({ midi: best.m, f0: m2f(best.m), amp: ref / amax, conf: Math.min(1, best.sal * 1.35), harm: best.cnt });
        // 잔차 제거: 이웃 배음(h-1,h+1) 보간으로 이 음이 만들었을 진폭을 추정해 차감
        // → 다른 음과 겹친 배음(옥타브 등)은 초과분만 남아 상위 음 검출이 가능
        const orig = best.hs.map(p => p ? p.a : 0);
        for (let h = 0; h < best.hs.length; h++) {
          const p = best.hs[h]; if (!p) continue;
          let est;
          if (h === 0) est = orig[0] ? Math.min(orig[0], (orig[1] || orig[0]) * 1.3) : 0;
          else {
            const lo = orig[h - 1], hi = orig[h + 1];
            est = (lo && hi) ? Math.sqrt(lo * hi) : (lo ? lo * 0.8 : orig[h] * 0.6);
          }
          est = Math.min(est * o.subK, p.a);
          p.a = Math.max(0, p.a - est);
        }
        pk.forEach(p => { if (p.a < p.a0 * 0.03) p.a = 1e-9; });
        // 잔차 최대값 대비 기준으로 계속 판단하기 위해 amax 유지(첫 음 기준)
      }
      return { rms, notes, peaks: pk.length };
    }
  }

  /* 온셋 검출 (시간영역 에너지 상승) */
  class OnsetDetector {
    constructor(sr, block = 512) { this.sr = sr; this.block = block; this.hist = []; this.last = -1; this.floor = 0.001; this.gate = 0.004; this.k = 1.7; }
    /** block rms와 시각(초) 입력 → 온셋이면 true */
    push(rms, t) {
      const H = this.hist;
      const avg = H.length ? H.reduce((a, b) => a + b, 0) / H.length : rms;
      this.floor = Math.min(this.floor * 1.0005 + 1e-7, Math.max(1e-5, rms)) * 0.999 + 1e-6;
      let on = false;
      if (rms > this.gate && rms > avg * this.k + 0.0008 && t - this.last > 0.07) { on = true; this.last = t; }
      H.push(rms); if (H.length > 8) H.shift();
      return on;
    }
  }

  /* 노트 트래커: 프레임별 후보 → noteOn/noteOff 이벤트 */
  class NoteTracker {
    constructor(opt = {}) {

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const Acct = {
  list: () => Store.get('accounts', []),
  async hash(pw, salt) { if (!crypto || !crypto.subtle) throw new Error('이 환경에서는 암호화 API(Web Crypto)를 사용할 수 없습니다. HTTPS/localhost에서 실행하세요.'); const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']); return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, k, 256)); },
  async register(email, nick, pw) {
    email = email.trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('이메일 형식이 올바르지 않습니다.'); if (pw.length < 8) throw new Error('비밀번호는 8자 이상이어야 합니다.');
    const L = this.list(); if (L.some(a => a.email === email)) throw new Error('이미 가입된 이메일입니다.');
    const salt = crypto.getRandomValues(new Uint8Array(16)), rc = [...crypto.getRandomValues(new Uint8Array(8))].map(x => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x % 32]).join(''), rsalt = crypto.getRandomValues(new Uint8Array(16));
    const a = { id: 'u' + Date.now().toString(36), email, nick, salt: b64(salt), hash: await this.hash(pw, salt), rsalt: b64(rsalt), rhash: await this.hash(rc, rsalt) };
    Store.set('accounts', [...L, a]); return { a, rc };
  },
  async login(email, pw) { email = email.trim().toLowerCase(); const a = this.list().find(x => x.email === email); if (!a || await this.hash(pw, unb64(a.salt)) !== a.hash) throw new Error('이메일 또는 비밀번호가 올바르지 않습니다.'); return a; },
  async reset(email, code, pw) { const L = this.list(), a = L.find(x => x.email === email.trim().toLowerCase()); if (!a || await this.hash(code.trim().toUpperCase(), unb64(a.rsalt)) !== a.rhash) throw new Error('이메일 또는 복구 코드가 올바르지 않습니다.'); if (pw.length < 8) throw new Error('비밀번호는 8자 이상이어야 합니다.'); const salt = crypto.getRandomValues(new Uint8Array(16)); a.salt = b64(salt); a.hash = await this.hash(pw, salt); Store.set('accounts', L); },
  use(a) { UID = a ? a.id : 'guest'; Store.set('session', UID); Game.load(); applySettings(); renderTop(); }

    if (tab === 'gloss') { const G = [['pp / p / mp / mf / f / ff', '매우 여리게 / 여리게 / 조금 여리게 / 조금 세게 / 세게 / 매우 세게'], ['crescendo / decrescendo', '점점 세게 / 점점 여리게'], ['Largo · Adagio · Andante · Moderato · Allegro · Presto', '매우 느리게 · 느리게 · 걸어가듯 · 보통 빠르기 · 빠르게 · 매우 빠르게'], ['ritardando (rit.)', '점점 느리게'], ['a tempo', '원래 빠르기로'], ['fermata 𝄐', '늘임표 — 충분히 길게 지속'], ['staccato / legato', '짧게 끊어서 / 부드럽게 이어서'], ['tie / slur', '같은 높이 음을 이어 하나로 / 다른 높이를 부드럽게 연결'], ['accent >', '그 음을 강조'], ['D.C. / D.S. / Fine / coda', '처음으로 / 기호로 / 끝 / 종결부'], ['sharp ♯ / flat ♭ / natural ♮', '반음 올림 / 반음 내림 / 제자리표'], ['dotted note', '음표 길이의 1.5배'], ['pedal (Ped.)', '서스테인 페달']]; box.innerHTML = `<table>${G.map(g => `<tr><td><b>${g[0]}</b></td><td>${g[1]}</td></tr>`).join('')}</table>`; }
  };
  draw();
};

/* ═══ 실력 진단 테스트 ═══ */
Views.diag = main => {
  const last = Game.S.diag;
  main.innerHTML = `<div class="wrap" style="max-width:820px"><h1>실력 진단 테스트</h1><div class="mute">악보 읽기(높은음자리·낮은음자리), 조표, 음정, 박 계산, 청음 문제 14개로 현재 수준을 추정하여 시작 학년을 추천합니다. 실제 연주 능력은 메인 아카데미에서 확인하게 됩니다.</div>${last ? `<div class="card" style="margin:10px 0">최근 결과: ${last.score}점 → 추천 <b>${last.year}학년</b> (${last.date})</div>` : ''}<div class="sp1"></div><button class="pri" id="st">진단 시작</button><div id="box"></div></div>`;
  $('#st').onclick = () => {
    const R = rng((Date.now() ^ Math.random() * 1e9) >>> 0), plan = [['read', { clef: 'treble', notes: ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5', 'D5'] }, 1], ['read', { clef: 'treble', notes: ['C4', 'D4', 'E4', 'G4', 'A4', 'C5', 'E5', 'F5', 'A5', 'F#4', 'Bb4'] }, 2], ['read', { clef: 'bass', notes: ['C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3', 'C4', 'G2', 'F2'] }, 2], ['read', { clef: 'bass', notes: ['C3', 'E3', 'G3', 'B2', 'A2', 'F#3', 'Eb3', 'D2', 'C2'] }, 3], ['keysig', { keys: ['C', 'G', 'F', 'D', 'Bb'] }, 2], ['keysig', { keys: ['A', 'E', 'Eb', 'Ab', 'B', 'Db'] }, 3], ['interval-read', { ivs: [2, 4, 5, 7, 12] }, 2], ['interval-read', { ivs: [1, 3, 6, 8, 9, 10, 11] }, 4], ['meter', {}, 2], ['meter', {}, 3], ['ear-interval', { ivs: [3, 4, 5, 7, 12], lv: 2 }, 2], ['ear-chord', { lv: 1 }, 2], ['ear-chord', { lv: 3 }, 4], ['ear-prog', { lv: 2 }, 4]];
    let i = 0, pts = 0, max = 0; const box = $('#box');
    const next = () => {
      if (i >= plan.length) { const sc = Math.round(pts / max * 100), yr = sc >= 90 ? 5 : sc >= 75 ? 4 : sc >= 58 ? 3 : sc >= 38 ? 2 : 1; Game.S.diag = { score: sc, year: yr, date: todayStr() }; Game.S.placeYear = Math.max(Game.S.placeYear || 1, yr); Game.save(); box.innerHTML = `<div class="card center" style="text-align:center;margin-top:12px"><div class="big">${sc}점</div><h2>추천 시작: ${yr}학년</h2><div class="mute">추천일 뿐 아카데미의 모든 스테이지는 언제든 열려 있습니다(순서 잠금 설정에 따름).</div><div class="sp1"></div><button class="pri" id="ac">아카데미로 이동</button></div>`; $('#ac').onclick = () => go('academy'); return; }
      const [k, c, w] = plan[i], q = QGEN[k](c, R); max += w; if (!q.choices) { i++; return next(); }
      box.innerHTML = `<div class="card" style="margin-top:12px"><div class="mute">${i + 1} / ${plan.length}</div><h2>${q.prompt}</h2>${q.play ? '<button class="sm" id="rp">🔊 듣기</button>' : ''}${q.staff ? `<div class="sheet" style="display:inline-block">${q.staff}</div>` : ''}<div class="ans" style="margin-top:10px">${q.choices.map(x => `<button data-v="${esc(x.v)}">${esc(x.l)}</button>`).join('')}</div></div>`;
      if (q.play) { $('#rp').onclick = q.play; setTimeout(q.play, 250); }
      $$('.ans button', box).forEach(b => b.onclick = () => { if (q.check(b.dataset.v)) pts += w; i++; next(); });
    }; next();
  };
};

  addEventListener('pointerdown', () => { try { Audio_.ensure(); } catch (e) { } }, { once: true });
  show();
  window.PIANOVA = P; window.__pianova = { Game, Input, Store, go, Views, SP, Composer, Quiz, QGEN };
}
